<header class="site-header">
  <div class="wrap header-wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <!-- Signature mark: a minimal DAG (Z confounds X → Y) -->
      <svg class="dag-mark" viewBox="0 0 64 40" aria-hidden="true">
        <defs>
          <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
          </marker>
        </defs>
        <line x1="14" y1="30" x2="46" y2="30" stroke="currentColor" stroke-width="1.6" marker-end="url(#arr)"/>
        <line x1="30" y1="12" x2="15" y2="25" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arr)"/>
        <line x1="34" y1="12" x2="49" y2="25" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arr)"/>
        <circle cx="10" cy="30" r="4.5" fill="currentColor"/>
        <circle cx="54" cy="30" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="32" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <span class="wordmark-text">Causes <em>and</em> Conditions</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/posts/' | relative_url }}" {% if page.url contains '/posts' or page.layout == 'post' %}class="active"{% endif %}>Posts</a>
      <a href="{{ '/datasets/' | relative_url }}" {% if page.url contains '/datasets' %}class="active"{% endif %}>Datasets</a>
      <a href="{{ '/methodology/' | relative_url }}" {% if page.url contains '/methodology' %}class="active"{% endif %}>Methodology</a>
    </nav>
  </div>
</header>
